<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ThreatHunter SIEM Alerts</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container py-5">

    <h1 class="mb-4">
        Detected Alerts
    </h1>

    <a href="/"
       class="btn btn-primary mb-4">
        Dashboard
    </a>

    <table class="table table-striped">

        <thead>

            <tr>
                <th>IP</th>
                <th>Type</th>
                <th>Severity</th>
                <th>Reason</th>
            </tr>

        </thead>

        <tbody>

            {% for alert in alerts %}

            <tr>

                <td>{{ alert.ip }}</td>

                <td>{{ alert.type }}</td>

                <td>{{ alert.severity }}</td>

                <td>{{ alert.reason }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
